<!doctype html>
<!-- TEMP level design lab (delete when done) -->
<html><head><meta charset="utf-8"><title>lab</title></head>
<body><pre id="out">solving…</pre>
<script type="module">
  import { LAB } from './_lab_levels.js';
  import { parseLevel, step, DIRS, cellAt } from '../src3d/rules.js';
  const DN = Object.keys(DIRS);
  const key = (s, im) => {
    const e = (p) => `${p.x},${p.y},${p.z},${p.st},${im ? '' : p.mass},${p.fallen ? 1 : 0}`;
    return `${e(s.sol)}|${e(s.cryo)}|${s.blocks.map((b) => `${b.x},${b.y},${b.z}`).sort().join(';')}`;
  };
  const STATES = {
    stack: (lv, s) => s.cryo.x === s.sol.x && s.cryo.y === s.sol.y && s.cryo.z === s.sol.z + 1,
    solOnCryo: (lv, s) => s.cryo.x === s.sol.x && s.cryo.y === s.sol.y && s.sol.z === s.cryo.z + 1,
    inGrate: (lv, s) => ['sol', 'cryo'].some((k) => cellAt(lv, s[k].x, s[k].y, s[k].z) === '='),
    frozen: (lv, s) => s.sol.st === 'frozen',
  };
  function bfs(level, init, { im = false, forbidEv = [], forbidSt = [], max = 600000 } = {}) {
    const seen = new Set([key(init, im)]);
    const nodes = [{ s: init, p: -1, d: null }];
    for (let i = 0; i < nodes.length; i++) {
      if (nodes.length > max) return { solved: false, capped: true, n: nodes.length };
      for (const d of DN) {
        const { state, changed, events } = step(level, nodes[i].s, d);
        if (!changed || state.status === 'lost') continue;
        if (events.some((e) => forbidEv.includes(e.type) || (e.type === 'blockfall' && forbidEv.includes('blockvoid') && e.to.z < 0))) continue;
        if (forbidEv.includes('boilOnSol') && events.some((e) => e.type === 'state' && e.who === 'cryo' && e.to === 'gas') &&
            events.some((e) => e.type === 'move' && e.who === 'cryo' && e.to.x === state.sol.x && e.to.y === state.sol.y && e.to.z === state.sol.z + 1)) continue;
        if (forbidEv.includes('drip') && events.some((e) => {
          if (e.type !== 'fall') return false;
          for (let z = Math.max(0, e.to.z); z < e.from.z; z++) if (cellAt(level, e.to.x, e.to.y, z) === '=') return true;
          return false;
        })) continue;
        if (forbidSt.some((f) => STATES[f](level, state))) continue;
        const k = key(state, im);
        if (seen.has(k)) continue;
        seen.add(k);
        nodes.push({ s: state, p: i, d });
        if (state.status === 'won') {
          const path = [];
          for (let n = nodes.length - 1; n > 0; n = nodes[n].p) path.unshift(nodes[n].d);
          return { solved: true, path, n: nodes.length };
        }
      }
    }
    return { solved: false, n: nodes.length };
  }
  const L = [];
  for (const def of LAB) {
    try {
      const free = parseLevel({ ...def, heat: 999, mass: 999 });
      const real = parseLevel(def);
      const a = bfs(free.level, free.state, { im: true });
      const b = bfs(real.level, real.state);
      L.push(`== ${def.name}`);
      L.push(` free: ${a.solved ? a.path.length : 'NO'} (${a.n}${a.capped ? ' CAP' : ''})`);
      L.push(` real h${def.heat} m${def.mass}: ${b.solved ? b.path.length + ' ' + b.path.join(',') : 'NO' + (b.capped ? ' CAP' : '')}`);
      if (def.forbid) {
        const c = bfs(free.level, free.state, { im: true, forbidEv: def.forbid.ev ?? [], forbidSt: def.forbid.st ?? [] });
        L.push(` without ${JSON.stringify(def.forbid)}: ${c.solved ? 'STILL SOLVABLE ' + c.path.length + ' ' + c.path.join(',') : 'unsolvable (good)'}${c.capped ? ' CAP' : ''}`);
      }
      if (def.try || (b.solved && def.trace)) {
        const path = def.try ?? b.path;
        let s = real.state;
        const f = (p) => `${p.x},${p.y},${p.z}${p.st[0]}${p.mass}`;
        L.push(`   0 S${f(s.sol)} C${f(s.cryo)}`);
        path.forEach((d, i) => {
          const r = step(real.level, s, d); s = r.state;
          const ev = r.events.filter((e) => !['move', 'tether', 'bump'].includes(e.type)).map((e) => e.type + (e.who ? ':' + e.who : '') + (e.to && typeof e.to === 'string' ? '>' + e.to : '')).join(' ');
          L.push(`  ${String(i + 1).padStart(2)} ${d.padEnd(5)} S${f(s.sol)} C${f(s.cryo)} ${s.blocks.map((bb) => 'B' + bb.x + ',' + bb.y + ',' + bb.z).join(' ')} ${ev} ${s.status}`);
        });
      }
    } catch (e) { L.push(`== ${def.name} ERROR ${e.message}`); }
  }
  document.getElementById('out').textContent = L.join('\n');
</script></body></html>
